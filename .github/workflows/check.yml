name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: node scripts/bootstrap.mjs
      - run: ./studio install --frozen-lockfile
      - run: ./studio setup
      - run: ./studio check
      - run: ./studio build
      - run: ./studio test
      - run: ./studio audit --audit-level=low
      - run: ./studio audit:k6
